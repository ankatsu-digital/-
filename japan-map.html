<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>兵庫県 天気マップ</title>
<style>
  :root{
    --bg: #f7f5f1;
    --panel-bg: #ffffff;
    --land: #dfe6e1;
    --stroke: #ffffff;
    --text: #2b3230;
    --sub: #8a8f8d;
    --accent: #c1502e;
    --line: #e7e4de;
    --marker: #2f6f5e;
    --marker-active: #c1502e;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif;
    color: var(--text);
    padding: 24px;
  }

  #app {
    max-width: 1300px;
    margin: 0 auto;
    display: flex;
    flex-wrap: wrap;
    gap: 24px;
    align-items: flex-start;
  }

  #map-wrap {
    flex: 1 1 640px;
    min-width: 320px;
  }

  #map-wrap h1 {
    font-size: 15px;
    letter-spacing: 0.08em;
    font-weight: 600;
    margin: 0 0 12px;
  }

  /* ---- タブ ---- */
  #day-tabs {
    display: flex;
    gap: 4px;
    margin-bottom: 14px;
    background: #eceae4;
    padding: 4px;
    border-radius: 10px;
    width: fit-content;
  }

  .day-tab {
    border: none;
    background: transparent;
    padding: 7px 18px;
    font-size: 13px;
    font-weight: 600;
    color: var(--sub);
    border-radius: 7px;
    cursor: pointer;
    font-family: inherit;
    transition: background 0.15s ease, color 0.15s ease;
  }

  .day-tab.active {
    background: #ffffff;
    color: var(--text);
    box-shadow: 0 1px 2px rgba(0,0,0,0.08);
  }

  .day-tab .date {
    font-weight: 400;
    color: var(--sub);
    font-size: 11px;
    margin-left: 4px;
  }

  #map-hint {
    font-size: 12px;
    color: var(--sub);
    margin: 10px 0 0;
  }

  #map-status {
    font-size: 12px;
    color: var(--sub);
    margin: 0 0 8px;
  }

  svg#hyogo-map {
    width: 100%;
    height: auto;
    display: block;
    max-height: 980px;
  }

  .pref-shape {
    fill: var(--land);
    stroke: #c8d0ca;
    stroke-width: 1;
  }

  .point {
    cursor: pointer;
  }

  .point circle {
    fill: var(--marker);
    stroke: #fff;
    stroke-width: 2;
    transition: r 0.15s ease, fill 0.15s ease;
  }

  .point.awaji circle {
    fill: #3d7ea6;
  }

  .point:hover circle {
    r: 9;
  }

  .point.is-selected circle {
    fill: var(--marker-active);
    r: 10;
  }

  .point .label {
    font-size: 13px;
    font-weight: 700;
    fill: var(--text);
    paint-order: stroke;
    stroke: #f7f5f1;
    stroke-width: 4px;
    pointer-events: none;
  }

  .point .chip {
    font-size: 15px;
    font-weight: 600;
    fill: var(--text);
    paint-order: stroke;
    stroke: #f7f5f1;
    stroke-width: 4px;
    pointer-events: none;
  }

  /* ---- 天気パネル ---- */
  #weather-panel {
    flex: 1 1 300px;
    min-width: 280px;
    background: var(--panel-bg);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 20px;
    position: sticky;
    top: 24px;
  }

  #weather-panel h2 {
    font-size: 18px;
    margin: 0 0 2px;
  }

  #weather-panel .sub {
    font-size: 12px;
    color: var(--sub);
    margin: 0 0 16px;
  }

  #weather-placeholder {
    font-size: 13px;
    color: var(--sub);
    line-height: 1.6;
  }

  #forecast-list {
    display: flex;
    flex-direction: column;
  }

  .forecast-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 0;
    border-bottom: 1px solid var(--line);
  }

  .forecast-row:last-child { border-bottom: none; }

  .forecast-date {
    width: 74px;
    flex-shrink: 0;
    font-size: 13px;
  }

  .forecast-date .dow {
    color: var(--sub);
    font-size: 11px;
  }

  .forecast-icon {
    width: 34px;
    text-align: center;
    font-size: 22px;
    flex-shrink: 0;
  }

  .forecast-desc {
    flex: 1;
    font-size: 12px;
  }

  .forecast-temp {
    font-size: 13px;
    white-space: nowrap;
    text-align: right;
  }

  .forecast-temp .max { color: var(--accent); font-weight: 600; }
  .forecast-temp .min { color: #5a8fc7; }

  .legend {
    font-size: 11px;
    color: var(--sub);
    margin-top: 10px;
  }
  .legend span { margin-right: 14px; }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:4px; vertical-align:middle; }
</style>
</head>
<body>

<div id="app">
  <div id="map-wrap">
    <h1>兵庫県 — 地点別 天気マップ</h1>

    <div id="day-tabs">
      <button class="day-tab" data-day="0">今日<span class="date" id="tab-date-0"></span></button>
      <button class="day-tab" data-day="1">明日<span class="date" id="tab-date-1"></span></button>
      <button class="day-tab" data-day="2">明後日<span class="date" id="tab-date-2"></span></button>
    </div>

    <div id="map-status">天気データを読み込み中...</div>
    <svg id="hyogo-map" viewBox="0 0 700 900"></svg>
    <p id="map-hint">
      タブで日付を切り替えると、地図上の天気表示が変わります。地点をクリックすると7日分すべて見られます。
    </p>
    <div class="legend">
      <span><span class="dot" style="background:#2f6f5e"></span>本土</span>
      <span><span class="dot" style="background:#3d7ea6"></span>淡路島</span>
    </div>
  </div>

  <div id="weather-panel">
    <div id="weather-placeholder">
      地図上の地点をクリックすると、7日間の予報を表示します。
    </div>
    <div id="weather-content" style="display:none;">
      <h2 id="weather-title"></h2>
      <p class="sub" id="weather-sub"></p>
      <div id="forecast-list"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js"></script>
<script>
(async function () {
  const svg = d3.select("#hyogo-map");
  const width = 700, height = 900;
  const statusEl = document.getElementById("map-status");
  let activeDay = 0;

  // 地点を絞って見やすく（本土3 + 淡路島の3市）
  const POINTS = [
    { name: "神戸市",     lat: 34.6901, lon: 135.1955, note: "県庁所在地・瀬戸内海側", awaji: false, dx: 12, dy: -6 },
    { name: "姫路市",     lat: 34.8154, lon: 134.6853, note: "西部の中心都市",         awaji: false, dx: -90, dy: -6 },
    { name: "豊岡市",     lat: 35.5372, lon: 134.8236, note: "北部・日本海側",         awaji: false, dx: 12, dy: -6 },
    { name: "淡路市",     lat: 34.4353, lon: 134.9098, note: "淡路島 北部",           awaji: true,  dx: 12, dy: -6 },
    { name: "洲本市",     lat: 34.3427, lon: 134.8991, note: "淡路島 中部",           awaji: true,  dx: 12, dy: -6 },
    { name: "南あわじ市", lat: 34.2596, lon: 134.7833, note: "淡路島 南部",           awaji: true,  dx: 12, dy: -6 }
  ];

  const WCODE = {
    0:["☀️","快晴"],1:["🌤️","晴れ"],2:["⛅","晴れ時々曇り"],3:["☁️","曇り"],
    45:["🌫️","霧"],48:["🌫️","霧氷"],
    51:["🌦️","霧雨（弱）"],53:["🌦️","霧雨"],55:["🌧️","霧雨（強）"],
    61:["🌦️","雨（弱）"],63:["🌧️","雨"],65:["🌧️","大雨"],
    66:["🌨️","着氷性の雨"],67:["🌨️","着氷性の雨（強）"],
    71:["🌨️","雪（弱）"],73:["❄️","雪"],75:["❄️","大雪"],77:["❄️","雪粒"],
    80:["🌦️","にわか雨（弱）"],81:["🌧️","にわか雨"],82:["⛈️","激しいにわか雨"],
    85:["🌨️","にわか雪（弱）"],86:["❄️","にわか雪"],
    95:["⛈️","雷雨"],96:["⛈️","雷雨（雹）"],99:["⛈️","激しい雷雨（雹）"]
  };
  const weekdays = ["日","月","火","水","木","金","土"];

  const placeholder = document.getElementById("weather-placeholder");
  const content = document.getElementById("weather-content");
  const titleEl = document.getElementById("weather-title");
  const subEl = document.getElementById("weather-sub");
  const listEl = document.getElementById("forecast-list");

  function renderPanel(point) {
    placeholder.style.display = "none";
    content.style.display = "block";
    titleEl.textContent = point.name;
    listEl.innerHTML = "";

    if (!point._daily) {
      subEl.textContent = "天気データを取得できませんでした。";
      return;
    }

    subEl.textContent = `${point.note} の7日間予報（Open-Meteo）`;
    const d = point._daily;

    d.time.forEach((dateStr, i) => {
      const date = new Date(dateStr + "T00:00:00");
      const mm = date.getMonth() + 1;
      const dd = date.getDate();
      const dow = weekdays[date.getDay()];
      const code = d.weathercode[i];
      const [icon, desc] = WCODE[code] || ["❓", "不明"];
      const tmax = Math.round(d.temperature_2m_max[i]);
      const tmin = Math.round(d.temperature_2m_min[i]);

      const label = i === 0 ? "（今日）" : i === 1 ? "（明日）" : i === 2 ? "（明後日）" : "";
      const row = document.createElement("div");
      row.className = "forecast-row";
      row.innerHTML = `
        <div class="forecast-date">${mm}/${dd}<div class="dow">${dow}曜日${label}</div></div>
        <div class="forecast-icon">${icon}</div>
        <div class="forecast-desc">${desc}</div>
        <div class="forecast-temp"><span class="max">${tmax}°</span> / <span class="min">${tmin}°</span></div>
      `;
      listEl.appendChild(row);
    });
  }

  async function fetchAllWeather(points) {
    const lats = points.map(p => p.lat).join(",");
    const lons = points.map(p => p.lon).join(",");
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${lats}&longitude=${lons}&daily=weathercode,temperature_2m_max,temperature_2m_min&timezone=Asia%2FTokyo&forecast_days=7`;

    const res = await fetch(url);
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    const results = Array.isArray(data) ? data : [data];
    results.forEach((r, i) => { points[i]._daily = r.daily; });
  }

  let chipTextSel = null;

  function updateChips() {
    if (!chipTextSel) return;
    chipTextSel.text(d => {
      if (!d._daily) return "?";
      const code = d._daily.weathercode[activeDay];
      const [icon] = WCODE[code] || ["❓"];
      const tmax = Math.round(d._daily.temperature_2m_max[activeDay]);
      const tmin = Math.round(d._daily.temperature_2m_min[activeDay]);
      return `${icon} ${tmax}°/${tmin}°`;
    });
  }

  function setActiveTab(day) {
    activeDay = day;
    document.querySelectorAll(".day-tab").forEach(btn => {
      btn.classList.toggle("active", Number(btn.dataset.day) === day);
    });
    updateChips();
  }

  document.querySelectorAll(".day-tab").forEach(btn => {
    btn.addEventListener("click", () => setActiveTab(Number(btn.dataset.day)));
  });

  try {
    const topo = await d3.json(
      "https://raw.githubusercontent.com/dataofjapan/land/master/japan.topojson"
    );
    const objectKey = Object.keys(topo.objects)[0];
    const geo = topojson.feature(topo, topo.objects[objectKey]);

    const hyogo = geo.features.find(f => f.properties.nam_ja === "兵庫県");
    if (!hyogo) throw new Error("兵庫県のデータが見つかりませんでした");

    const projection = d3.geoMercator().fitExtent(
      [[20, 20], [width - 20, height - 20]],
      hyogo
    );
    const path = d3.geoPath().projection(projection);

    svg.append("path")
      .datum(hyogo)
      .attr("class", "pref-shape")
      .attr("d", path);

    const pointsG = svg.append("g");

    const pointSel = pointsG.selectAll("g.point")
      .data(POINTS)
      .join("g")
      .attr("class", d => "point" + (d.awaji ? " awaji" : ""))
      .attr("transform", d => {
        const [x, y] = projection([d.lon, d.lat]);
        return `translate(${x},${y})`;
      })
      .on("click", function (event, d) {
        svg.selectAll(".point").classed("is-selected", false);
        d3.select(this).classed("is-selected", true);
        renderPanel(d);
      });

    pointSel.append("circle").attr("r", 6);
    pointSel.append("text")
      .attr("class", "label")
      .attr("x", d => d.dx)
      .attr("y", d => d.dy)
      .text(d => d.name);

    chipTextSel = pointSel.append("text")
      .attr("class", "chip")
      .attr("x", d => d.dx)
      .attr("y", d => d.dy + 20)
      .text("...");

    try {
      await fetchAllWeather(POINTS);

      // タブに日付を表示（今日/明日/明後日）
      const firstWithData = POINTS.find(p => p._daily);
      if (firstWithData) {
        [0, 1, 2].forEach(i => {
          const dateStr = firstWithData._daily.time[i];
          const date = new Date(dateStr + "T00:00:00");
          const el = document.getElementById("tab-date-" + i);
          if (el) el.textContent = ` ${date.getMonth() + 1}/${date.getDate()}`;
        });
      }

      updateChips();
      setActiveTab(0);
      statusEl.remove();
    } catch (err) {
      statusEl.textContent = "天気データの取得に失敗しました: " + err.message;
    }

  } catch (err) {
    document.getElementById("map-hint").textContent =
      "地図データの読み込みに失敗しました: " + err.message;
  }
})();
</script>

</body>
</html>
