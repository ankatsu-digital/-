<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>日本地図（埋め込み用）</title>
<style>
  :root{
    --bg: #f7f5f1;
    --land: #dfe6e1;
    --land-hover: #4d7c6f;
    --stroke: #ffffff;
    --text: #2b3230;
    --accent: #c1502e;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif;
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }

  #map-wrap {
    position: relative;
    width: 100%;
    max-width: 640px;
    padding: 24px;
  }

  #map-wrap h1 {
    font-size: 15px;
    letter-spacing: 0.08em;
    font-weight: 600;
    margin: 0 0 12px;
    color: var(--text);
  }

  svg#japan-map {
    width: 100%;
    height: auto;
    display: block;
  }

  /* ここが「CSSで色分けできる」ポイント：
     各都道府県の <path> に .pref クラスと data-pref (都道府県名) が入る */
  .pref {
    fill: var(--land);
    stroke: var(--stroke);
    stroke-width: 0.6;
    cursor: pointer;
    transition: fill 0.2s ease, transform 0.2s ease;
    transform-origin: center;
  }

  .pref:hover {
    fill: var(--land-hover);
  }

  /* 特定の県だけ強調したい場合は data-pref を使ってCSSで指定できる */
  .pref[data-pref="東京都"],
  .pref[data-pref="大阪府"] {
    /* 例: fill: var(--accent); */
  }

  .pref.is-selected {
    fill: var(--accent);
  }

  #tooltip {
    position: fixed;
    pointer-events: none;
    background: var(--text);
    color: #fff;
    font-size: 12px;
    padding: 4px 8px;
    border-radius: 4px;
    opacity: 0;
    transform: translate(-50%, -130%);
    transition: opacity 0.15s ease;
    white-space: nowrap;
    z-index: 10;
  }

  #tooltip.show { opacity: 1; }

  #status {
    font-size: 12px;
    color: #8a8f8d;
    margin-top: 10px;
  }
</style>
</head>
<body>

<div id="map-wrap">
  <h1>JAPAN — 都道府県マップ</h1>
  <svg id="japan-map" viewBox="0 0 800 800"></svg>
  <div id="status">地図データを読み込み中...</div>
</div>

<div id="tooltip"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/topojson-client/3.1.0/topojson-client.min.js"></script>
<script>
(async function () {
  const svg = d3.select("#japan-map");
  const tooltip = document.getElementById("tooltip");
  const status = document.getElementById("status");
  const width = 800, height = 800;

  try {
    // 公開されている日本の都道府県 TopoJSON（dataofjapan/land）
    const topo = await d3.json(
      "https://raw.githubusercontent.com/dataofjapan/land/master/japan.topojson"
    );

    const objectKey = Object.keys(topo.objects)[0];
    const geo = topojson.feature(topo, topo.objects[objectKey]);

    const projection = d3.geoMercator().fitSize([width - 20, height - 20], geo);
    // 少し余白を入れる
    projection.translate([
      projection.translate()[0] + 10,
      projection.translate()[1] + 10
    ]);
    const path = d3.geoPath().projection(projection);

    svg.selectAll("path")
      .data(geo.features)
      .join("path")
      .attr("class", "pref")
      .attr("d", path)
      .attr("data-pref", d => d.properties.nam_ja || d.properties.name || d.properties.nam)
      .on("mousemove", (event, d) => {
        const name = d.properties.nam_ja || d.properties.name || d.properties.nam || "";
        tooltip.textContent = name;
        tooltip.style.left = event.clientX + "px";
        tooltip.style.top = event.clientY + "px";
        tooltip.classList.add("show");
      })
      .on("mouseleave", () => tooltip.classList.remove("show"))
      .on("click", function () {
        // クリックで色を切り替える簡単な例（用途に応じて変更/削除OK）
        this.classList.toggle("is-selected");
      });

    status.remove();
  } catch (err) {
    status.textContent = "地図データの読み込みに失敗しました: " + err.message;
  }
})();
</script>

</body>
</html>
