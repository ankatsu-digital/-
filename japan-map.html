<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>兵庫県 天気マップ</title>
<style>
  :root{
    --bg: #f7f5f1;
    --land: #dfe6e1;
    --text: #2b3230;
    --sub: #8a8f8d;
    --marker: #2f6f5e;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif;
    color: var(--text);
    padding: 24px;
  }

  #map-wrap {
    max-width: 720px;
    margin: 0 auto;
  }

  #map-wrap h1 {
    font-size: 15px;
    letter-spacing: 0.08em;
    font-weight: 600;
    margin: 0 0 12px;
  }

  /* ---- タブ ---- */
  #day-tabs {
    display: flex;
    gap: 4px;
    margin-bottom: 14px;
    background: #eceae4;
    padding: 4px;
    border-radius: 10px;
    width: fit-content;
  }

  .day-tab {
    border: none;
    background: transparent;
    padding: 7px 18px;
    font-size: 13px;
    font-weight: 600;
    color: var(--sub);
    border-radius: 7px;
    cursor: pointer;
    font-family: inherit;
    transition: background 0.15s ease, color 0.15s ease;
  }

  .day-tab.active {
    background: #ffffff;
    color: var(--text);
    box-shadow: 0 1px 2px rgba(0,0,0,0.08);
  }

  .day-tab .date {
    font-weight: 400;
    color: var(--sub);
    font-size: 11px;
    margin-left: 4px;
  }

  #map-status {
    font-size: 12px;
    color: var(--sub);
    margin: 0 0 8px;
  }

  svg#hyogo-map {
    width: 100%;
    height: auto;
    display: block;
  }

  .pref-shape {
    fill: var(--land);
    stroke: #c8d0ca;
    stroke-width: 1;
  }

  .point circle {
    fill: var(--marker);
    stroke: #fff;
    stroke-width: 2;
  }

  .point.awaji circle {
    fill: #3d7ea6;
  }

  .point .label {
    font-size: 13px;
    font-weight: 700;
    fill: var(--text);
    paint-order: stroke;
    stroke: #f7f5f1;
    stroke-width: 4px;
  }

  .point .chip {
    font-size: 15px;
    font-weight: 600;
    fill: var(--text);
    paint-order: stroke;
    stroke: #f7f5f1;
    stroke-width: 4px;
  }

  .legend {
    font-size: 11px;
    color: var(--sub);
    margin-top: 10px;
  }
  .legend span { margin-right: 14px; }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:4px; vertical-align:middle; }
</style>
</head>
<body>

<div id="map-wrap">
  <h1>兵庫県 — 地点別 天気マップ</h1>

  <div id="day-tabs">
    <button class="day-tab" data-day="0">今日<span class="date" id="tab-date-0"></span></button>
    <button class="day-tab" data-day="1">明日<span class="date" id="tab-date-1"></span></button>
    <button class="day-tab" data-day="2">明後日<span class="date" id="tab-date-2"></span></button>
  </div>

  <div id="map-status">天気データを読み込み中...</div>
  <svg id="hyogo-map" viewBox="0 0 700 900"></svg>

  <div class="legend">
    <span><span class="dot" style="background:#2f6f5e"></span>本土</span>
    <span><span class="dot" style="background:#3d7ea6"></span>淡路島</span>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js"></script>
<script>
(async function () {
  const svg = d3.select("#hyogo-map");
  const width = 700, height = 900;
  const statusEl = document.getElementById("map-status");
  let activeDay = 0;

  const POINTS = [
    { name: "神戸市",     lat: 34.6901, lon: 135.1955, awaji: false, dx: 12, dy: -6 },
    { name: "姫路市",     lat: 34.8154, lon: 134.6853, awaji: false, dx: -90, dy: -6 },
    { name: "豊岡市",     lat: 35.5372, lon: 134.8236, awaji: false, dx: 12, dy: -6 },
    { name: "淡路市",     lat: 34.4353, lon: 134.9098, awaji: true,  dx: 12, dy: -6 },
    { name: "洲本市",     lat: 34.3427, lon: 134.8991, awaji: true,  dx: 12, dy: -6 },
    { name: "南あわじ市", lat: 34.2596, lon: 134.7833, awaji: true,  dx: 12, dy: -6 }
  ];

  const WCODE = {
    0:"☀️",1:"🌤️",2:"⛅",3:"☁️",
    45:"🌫️",48:"🌫️",
    51:"🌦️",53:"🌦️",55:"🌧️",
    61:"🌦️",63:"🌧️",65:"🌧️",
    66:"🌨️",67:"🌨️",
    71:"🌨️",73:"❄️",75:"❄️",77:"❄️",
    80:"🌦️",81:"🌧️",82:"⛈️",
    85:"🌨️",86:"❄️",
    95:"⛈️",96:"⛈️",99:"⛈️"
  };

  async function fetchAllWeather(points) {
    const lats = points.map(p => p.lat).join(",");
    const lons = points.map(p => p.lon).join(",");
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${lats}&longitude=${lons}&daily=weathercode,temperature_2m_max,temperature_2m_min&timezone=Asia%2FTokyo&forecast_days=7`;

    const res = await fetch(url);
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    const results = Array.isArray(data) ? data : [data];
    results.forEach((r, i) => { points[i]._daily = r.daily; });
  }

  let chipTextSel = null;

  function updateChips() {
    if (!chipTextSel) return;
    chipTextSel.text(d => {
      if (!d._daily) return "?";
      const code = d._daily.weathercode[activeDay];
      const icon = WCODE[code] || "❓";
      const tmax = Math.round(d._daily.temperature_2m_max[activeDay]);
      const tmin = Math.round(d._daily.temperature_2m_min[activeDay]);
      return `${icon} ${tmax}°/${tmin}°`;
    });
  }

  function setActiveTab(day) {
    activeDay = day;
    document.querySelectorAll(".day-tab").forEach(btn => {
      btn.classList.toggle("active", Number(btn.dataset.day) === day);
    });
    updateChips();
  }

  document.querySelectorAll(".day-tab").forEach(btn => {
    btn.addEventListener("click", () => setActiveTab(Number(btn.dataset.day)));
  });

  try {
    const topo = await d3.json(
      "https://raw.githubusercontent.com/dataofjapan/land/master/japan.topojson"
    );
    const objectKey = Object.keys(topo.objects)[0];
    const geo = topojson.feature(topo, topo.objects[objectKey]);

    const hyogo = geo.features.find(f => f.properties.nam_ja === "兵庫県");
    if (!hyogo) throw new Error("兵庫県のデータが見つかりませんでした");

    const projection = d3.geoMercator().fitExtent(
      [[20, 20], [width - 20, height - 20]],
      hyogo
    );
    const path = d3.geoPath().projection(projection);

    svg.append("path")
      .datum(hyogo)
      .attr("class", "pref-shape")
      .attr("d", path);

    const pointsG = svg.append("g");

    const pointSel = pointsG.selectAll("g.point")
      .data(POINTS)
      .join("g")
      .attr("class", d => "point" + (d.awaji ? " awaji" : ""))
      .attr("transform", d => {
        const [x, y] = projection([d.lon, d.lat]);
        return `translate(${x},${y})`;
      });

    pointSel.append("circle").attr("r", 6);
    pointSel.append("text")
      .attr("class", "label")
      .attr("x", d => d.dx)
      .attr("y", d => d.dy)
      .text(d => d.name);

    chipTextSel = pointSel.append("text")
      .attr("class", "chip")
      .attr("x", d => d.dx)
      .attr("y", d => d.dy + 20)
      .text("...");

    try {
      await fetchAllWeather(POINTS);

      const firstWithData = POINTS.find(p => p._daily);
      if (firstWithData) {
        [0, 1, 2].forEach(i => {
          const dateStr = firstWithData._daily.time[i];
          const date = new Date(dateStr + "T00:00:00");
          const el = document.getElementById("tab-date-" + i);
          if (el) el.textContent = ` ${date.getMonth() + 1}/${date.getDate()}`;
        });
      }

      updateChips();
      setActiveTab(0);
      statusEl.remove();
    } catch (err) {
      statusEl.textContent = "天気データの取得に失敗しました: " + err.message;
    }

  } catch (err) {
    statusEl.textContent = "地図データの読み込みに失敗しました: " + err.message;
  }
})();
</script>

</body>
</html>
